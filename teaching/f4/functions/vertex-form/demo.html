<style>
:root{
  --blue:#1d6fd8; --ink:#1f2937; --muted:#5b6575;
  --green:#2f9e44; --red:#e03131; --purple:#7048e8; --orange:#e67700; --pink:#e64980;
  --cjk:'Microsoft JhengHei','PingFang TC','Noto Sans TC','Noto Sans CJK TC','Noto Sans CJK HK','Heiti TC',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--cjk);color:var(--ink);background:#eef3f9;font-size:20px;-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:#fff;border-bottom:4px solid var(--blue)}
h1{font-size:26px;margin:0;letter-spacing:1px}
h1 small{font-size:17px;color:var(--muted);font-weight:normal;margin-left:8px}
.tabs{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
button{font-family:inherit;font-size:19px;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:12px;padding:8px 14px;cursor:pointer;min-height:46px;touch-action:manipulation;transition:background .15s}
button:hover{background:#e8f1fd}
button:disabled{opacity:.4;cursor:default;background:#fff}
button.primary{background:var(--blue);color:#fff}
button.primary:hover{background:#155bb5}
.tab.on,.seg button.on,.presets button.on,.qopt.on{background:var(--blue);color:#fff}
main{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:14px;padding:12px 16px;align-items:start}
@media (max-width:1100px),(orientation:portrait){main{grid-template-columns:1fr}}
@media (min-width:1101px) and (orientation:landscape){.panel{position:sticky;top:8px;max-height:calc(100vh - 90px);overflow-y:auto}}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(30,60,110,.10);padding:12px 14px}
.stagehead{display:flex;flex-direction:column;gap:8px;min-height:72px}
.flags{display:flex;gap:4px;flex-wrap:wrap}
.flag{background:#a9c4ea;color:#fff;padding:6px 18px 6px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 11px) 50%,100% 100%,0 100%);font-weight:bold;font-size:15px;cursor:pointer;user-select:none}
.flag.on{background:var(--blue)}
.caption{font-size:22px;font-weight:bold;line-height:1.4}
.caption .sub{display:block;font-size:17px;font-weight:normal;color:var(--muted);margin-top:2px;line-height:1.5}
.stagewrap{position:relative}
svg#stage{width:100%;height:auto;max-height:calc(100vh - 280px);min-height:360px;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.lbllayer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
.svglbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;line-height:1.2;
  text-shadow:0 0 2px #fff,0 0 3px #fff,1.5px 1.5px 0 #fff,-1.5px -1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px 1.5px 0 #fff}
.svglbl.noshadow{text-shadow:none}
.svglbl.tl{transform:none}
.svglbl.l{transform:translate(0,-50%)}
.svglbl.r{transform:translate(-100%,-50%)}
.svglbl .katex{font-size:1em}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding-top:8px;align-items:center}
.kbd{font-size:14px;color:var(--muted);text-align:center;margin-top:4px}
.panel h2{font-size:21px;margin:4px 0 8px;color:var(--blue)}
.panel h3{font-size:18px;margin:12px 0 6px;color:#123e7a}
.panel p{margin:6px 0;line-height:1.5}
.hidden{display:none !important}
.katex{font-size:1.08em}
.m{white-space:nowrap}
.note{font-size:15px;color:var(--muted);line-height:1.5}
.box{border:3px solid var(--blue);border-radius:14px;padding:8px 12px;background:#f2f7ff;margin:8px 0;font-size:18px;line-height:1.55}
.warnbox{border:2px solid #f08c00;background:#fff4e6;border-radius:12px;padding:6px 10px;margin:8px 0;font-size:16px;line-height:1.5}
.okbox{border:2px solid #69b47a;background:#e6f6e6;border-radius:12px;padding:6px 10px;margin:8px 0;font-size:17px;line-height:1.5;color:#1d5b2a}
.badbox{border:2px solid #e03131;background:#fff0f3;border-radius:12px;padding:6px 10px;margin:8px 0;font-size:16px;line-height:1.5;color:#8f1d42}
.inrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.inrow input[type=number],.inrow input[type=text]{font-size:20px;width:72px;padding:6px 8px;border:2px solid #9bb8e0;border-radius:10px;font-family:inherit;text-align:center}
.inrow input[type=range]{flex:1;min-width:120px;height:28px;accent-color:var(--blue)}
.presets{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.presets button{font-size:15px;min-height:36px;padding:3px 10px;border-radius:9px}
.seg{display:flex;border:2px solid var(--blue);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{border:none;border-radius:0;min-height:40px;font-size:16px;padding:4px 12px}
.seg button+button{border-left:1px solid #b9d0f0}
.stat{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:17px;margin:6px 0}
.stat .k{color:var(--muted);text-align:right}
.stat .v{font-weight:bold}
.gc{color:var(--green)}.rc{color:var(--red)}.pc{color:var(--purple)}.bc{color:var(--blue)}.oc{color:var(--orange)}.pk{color:var(--pink)}
label.chk{display:flex;align-items:center;gap:8px;font-size:17px;margin:8px 0;cursor:pointer}
label.chk input{width:22px;height:22px;accent-color:var(--blue)}
.feat{border:2px solid #d0dbea;border-radius:12px;padding:8px 10px;margin:6px 0;background:#fbfdff;font-size:17px;line-height:1.5}
.feat.on{border-color:var(--blue);background:#f2f7ff}
.feat .fn{font-weight:bold;color:#123e7a;margin-bottom:2px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
@media (max-width:520px){.cmp{grid-template-columns:1fr}}
.cmpcol{border:2px solid #d0dbea;border-radius:12px;padding:10px;background:#fbfdff}
.cmpcol.up{border-color:#69b47a;background:#f0faf0}
.cmpcol.dn{border-color:#e03131;background:#fff5f5}
.cmpcol h3{margin:0 0 6px;font-size:18px;text-align:center}
.cmpcol ul{margin:6px 0 0;padding-left:1.2em;font-size:16px;line-height:1.55}
.cmpcol li{margin:3px 0}
.qopt{display:block;width:100%;text-align:left;margin:6px 0;border-radius:10px;font-size:17px;padding:10px 12px}
.qopt.correct{background:#e6f6e6;border-color:#69b47a;color:#1d5b2a}
.qopt.wrong{background:#fff0f3;border-color:#e03131;color:#8f1d42}
.speedrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:4px}
.speedbtn{font-size:14px;min-height:32px;padding:2px 10px;border-radius:8px}
.seek{width:min(320px,70%);height:10px;accent-color:var(--blue)}
</style>
</head>
<body>
<header>
  <h1>頂點式<small>中四數學 · 二次函數 <span class="m" data-tex="y=a(x-h)^2+k"></span></small></h1>
  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="1">① 特徵總結</button>
    <button class="tab" data-tab="2">② 動態探究</button>
    <button class="tab" data-tab="3">③ 小練習</button>
  </div>
</header>
<main>
  <section class="card">
    <div class="stagehead">
      <div class="flags" id="flags"></div>
      <div class="caption" id="caption"></div>
    </div>
    <div class="stagewrap" id="stageWrap">
      <svg id="stage" viewBox="0 0 720 520" aria-label="頂點式圖形"></svg>
      <div class="lbllayer" id="lblLayer"></div>
    </div>
    <div class="controls" id="ctlBar">
      <button id="btnPrev">◀ 上一步</button>
      <button id="btnNext" class="primary">下一步 ▶</button>
      <button id="btnPlay" class="primary">▶ 播放</button>
      <button id="btnPause" class="hidden">⏸ 暫停</button>
      <button id="btnReset">↺ 重設</button>
    </div>
    <div class="speedrow hidden" id="seekRow">
      <input type="range" class="seek" id="seek" min="0" max="100" value="0" step="1">
      <button class="speedbtn on" data-spd="1">1×</button>
      <button class="speedbtn" data-spd="0.75">0.75×</button>
      <button class="speedbtn" data-spd="0.5">0.5×</button>
    </div>
    <div class="kbd" id="kbd">提示：特徵總結對照課本；動態探究拉動 <span class="m" data-tex="a,h,k"></span> 滑桿</div>
  </section>

  <!-- Panel 1: Summary -->
  <aside class="card panel" id="panel1">
    <h2>頂點式特徵總結</h2>
    <div class="box">
      二次函數的<span class="pc">頂點式</span>：
      <span class="m" data-tex="y = a(x - h)^2 + k"></span>
      （<span class="m" data-tex="a \neq 0"></span>）
    </div>
    <div class="cmp">
      <div class="cmpcol up">
        <h3 class="gc"><span class="m" data-tex="a > 0"></span></h3>
        <ul>
          <li>開口<span class="gc">向上</span></li>
          <li>對稱軸 <span class="m" data-tex="x = h"></span></li>
          <li>頂點 <span class="m" data-tex="(h,k)"></span> 是<span class="gc">最低點</span></li>
          <li>當 <span class="m" data-tex="x=h"></span> 時，<span class="m" data-tex="y"></span> 的<span class="gc">極小值</span>是 <span class="m" data-tex="k"></span></li>
        </ul>
      </div>
      <div class="cmpcol dn">
        <h3 class="rc"><span class="m" data-tex="a < 0"></span></h3>
        <ul>
          <li>開口<span class="rc">向下</span></li>
          <li>對稱軸 <span class="m" data-tex="x = h"></span></li>
          <li>頂點 <span class="m" data-tex="(h,k)"></span> 是<span class="rc">最高點</span></li>
          <li>當 <span class="m" data-tex="x=h"></span> 時，<span class="m" data-tex="y"></span> 的<span class="rc">極大值</span>是 <span class="m" data-tex="k"></span></li>
        </ul>
      </div>
    </div>
    <div id="p1note" class="note"></div>
    <p class="note">▶ 播放：逐步標示開口、對稱軸、頂點與極值。</p>
  </aside>

  <!-- Panel 2: Explore -->
  <aside class="card panel hidden" id="panel2">
    <h2>動態探究</h2>
    <div class="box">拉動滑桿，觀察參數與圖形的<span class="pc">對應關係</span>。</div>
    <div class="presets" id="v_presets"></div>
    <div class="inrow">
      <span class="m" data-tex="a ="></span>
      <input type="range" id="v_a" min="-3" max="3" step="0.25" value="1">
      <input type="number" id="v_an" min="-3" max="3" step="0.25" value="1">
    </div>
    <div class="inrow">
      <span class="m" data-tex="h ="></span>
      <input type="range" id="v_h" min="-4" max="4" step="0.5" value="1">
      <input type="number" id="v_hn" min="-4" max="4" step="0.5" value="1">
    </div>
    <div class="inrow">
      <span class="m" data-tex="k ="></span>
      <input type="range" id="v_k" min="-4" max="4" step="0.5" value="-1">
      <input type="number" id="v_kn" min="-4" max="4" step="0.5" value="-1">
    </div>
    <div class="stat" id="v_stats"></div>
    <label class="chk"><input type="checkbox" id="v_axis" checked>顯示對稱軸 <span class="m" data-tex="x=h"></span></label>
    <label class="chk"><input type="checkbox" id="v_vert" checked>顯示頂點 <span class="m" data-tex="(h,k)"></span></label>
    <label class="chk"><input type="checkbox" id="v_ext" checked>顯示極值線 <span class="m" data-tex="y=k"></span></label>
    <div class="okbox" id="v_msg"></div>
    <p class="note">▶ 播放：依次改變 <span class="m" data-tex="a"></span>（開口）、<span class="m" data-tex="h"></span>（左右）、<span class="m" data-tex="k"></span>（上下）。</p>
  </aside>

  <!-- Panel 3: Practice -->
  <aside class="card panel hidden" id="panel3">
    <h2>小練習</h2>
    <div class="box" id="q_prompt"></div>
    <div id="q_opts"></div>
    <div id="q_fb" class="hidden"></div>
    <div class="controls" style="justify-content:flex-start;padding-top:10px">
      <button id="btnQNext" class="primary">下一題 ▶</button>
      <button id="btnQReset">↺ 重頭</button>
    </div>
    <p class="note" id="q_score"></p>
  </aside>
</main>

  const ymin=o.ymin!=null?o.ymin:-4.5, ymax=o.ymax!=null?o.ymax:5;
  plotCurve(x=>yOf(a,h,k,x),col,{tS,xmin,xmax,ymin,ymax,sw:o.sw||3.8,op:o.op,steps:o.steps||260});
  if(o.showAxis!==false){
    dashV(h,'#e67700',{tS,ymin,ymax,sw:2.2,dash:'8 5',op:o.axisOp!=null?o.axisOp:0.9});
    if(o.axisLabel!==false){
      const ly=clamp(ymax-0.45, ymin+0.5, ymax);
      lab(tS(h+0.35,ly), R`x=`+(o.symH?R`h`:nT(h)), {fs:o.lfs||15,col:'#e67700',bold:true,op:o.axisOp});
    }
  }
  if(o.showExt){
    dashH(k,'#64748b',{tS,xmin,xmax,sw:1.6,dash:'5 4',op:0.65});
  }
  if(o.showVertex!==false){
    const P=markPt(h,k,'#e67700',{tS,r:o.vr||7,op:o.vOp});
    if(o.vertexLabel!==false){
      const label=o.symHK?R`(h,k)`:R`(`+nT(h)+R`,`+nT(k)+R`)`;
      const dy=a>0?-22:22;
      const dx=(h<(xmax+xmin)/2+1)?28:-28;
      lab(V(P.x+dx,P.y+dy), label, {fs:o.lfs||16,col:'#e67700',bold:true,op:o.vOp});
    }
  }
  if(o.eqLabel){
    const lx=clamp(h+(a>0?2.4:-2.4), xmin+0.8, xmax-0.8);
    const ly=clamp(yOf(a,h,k,lx), ymin+0.6, ymax-0.6);
    lab(tS(lx,ly), o.eqLabel===true?vfEq(a,h,k):o.eqLabel, {fs:14,col,bold:true});
  }
  if(o.extLabel){
    const side=h<(xmin+xmax)/2?xmax-0.6:xmin+0.6;
    const txt=a>0?R`\text{極小值 }y=k`:R`\text{極大值 }y=k`;
    lab(tS(side,k+(a>0?-0.55:0.55)), o.extLabel===true?txt:o.extLabel, {fs:14,col:'#475569',bold:true});
  }
}

function playExplore(){
  stopAnim();PLAYING=true;updatePlayUI();
  // Sequence: a 1→-1, then h 0→2, then k 0→-2, then settle
  const seq=[
    {a:1,h:0,k:0,msg:'開始：'+mt('y=x^2')},
    {a:1,h:0,k:0,dur:400},
    {a:-1,h:0,k:0,dur:2200,msg:'改變 '+mt('a')+'：開口由向上變向下'},
    {a:-1,h:2,k:0,dur:1800,msg:'改變 '+mt('h')+'：圖形左右平移'},
    {a:-1,h:2,k:2,dur:1800,msg:'改變 '+mt('k')+'：圖形上下平移'},
    {a:1,h:1,k:-1,dur:2000,msg:'回到探究預設'}
  ];
  // Build keyframes with absolute times
  let keyframes=[{t:0,a:1,h:0,k:0,msg:seq[0].msg}];
  let tAcc=0;
  for(let i=1;i<seq.length;i++){
    tAcc+=(seq[i].dur||1000);
    keyframes.push({t:tAcc,a:seq[i].a,h:seq[i].h,k:seq[i].k,msg:seq[i].msg});
  }
  const TOT=tAcc;
  function applyAt(u){
    // u in [0,1]
    const tt=u*TOT;
    let i=0;
    while(i<keyframes.length-1 && keyframes[i+1].t<=tt)i++;
    const A0=keyframes[i], A1=keyframes[Math.min(i+1,keyframes.length-1)];
    const span=Math.max(1,A1.t-A0.t);
    const local=ease(clamp((tt-A0.t)/span,0,1));
    A=rnd(lerp(A0.a,A1.a,local));
    if(Math.abs(A)<0.12)A=A>=0?0.25:-0.25;
    HH=rnd(lerp(A0.h,A1.h,local));
    KK=rnd(lerp(A0.k,A1.k,local));
    // snap to step for display
    A=Math.round(A*4)/4; HH=Math.round(HH*2)/2; KK=Math.round(KK*2)/2;
    if(Math.abs(A)<0.12)A=A>=0?0.25:-0.25;
    syncSliders();
    SEEK_T=u*100;
    $('seek').value=SEEK_T;
    drawExplore();
    if(A0.msg)setCaption(mt(vfEq(A,HH,KK)), A0.msg+(A1.msg&&local>0.95?' → '+A1.msg:''));
  }
  SEEK_T=0;$('seek').value=0;
  tween(TOT,t=>{
    if(!PLAYING)return;
    applyAt(t);
  },()=>{
    PLAYING=false;updatePlayUI();
    A=1;HH=1;KK=-1;syncSliders();drawExplore();
  });
}

function drawPractice(){

  const q=QUESTIONS[QI];
  if(!q.noGraph){

    });

    lab(V(360,260), q.eq||vfEq(q.a,q.h,q.k), {fs:32,col:'#1d6fd8',bold:true});
  }
  setCaption('小練習 '+(QI+1), q.prompt);
  $('q_prompt').innerHTML=q.prompt+(q.eq?'　'+mt(q.eq):'');
  renderTex($('q_prompt'));

  const box=$('q_opts');box.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='qopt';
    b.innerHTML=formatOpt(opt);
    b.disabled=Q_ANSWERED;
    if(Q_ANSWERED){
      if(i===q.ans)b.classList.add('correct');
      else if(i===Q_PICK)b.classList.add('wrong');
    }
    b.onclick=()=>answerQ(i);
    box.appendChild(b);

  $('q_score').textContent='得分：'+Q_SCORE+'／'+Q_DONE+(Q_DONE?('（正確率 '+Math.round(100*Q_SCORE/Q_DONE)+'%）'):'');

let Q_PICK=-1;
function formatOpt(s){
  if(/^[(\-0-9xy=,+.\s]+$/.test(s) || /^x=/.test(s) || /^y=/.test(s) || /^\(/.test(s)) return mt(s);
  let out = esc(s);
  out = out.replace(/\((-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)\)/g, function(_,a,b){return mt('('+a+','+b+')');});
  out = out.replace(/\bx=(-?\d+(?:\.\d+)?)/g, function(_,a){return mt('x='+a);});
  out = out.replace(/\by=(-?\d+(?:\.\d+)?)/g, function(_,a){return mt('y='+a);});
  return out;
}
function answerQ(i){
  if(Q_ANSWERED)return;
  Q_ANSWERED=true;Q_PICK=i;Q_DONE++;
  const q=QUESTIONS[QI];
  if(i===q.ans){Q_SCORE++;$('q_fb').className='okbox';$('q_fb').innerHTML='✓ 正確！';}
  else{$('q_fb').className='badbox';$('q_fb').innerHTML='✗ 不對。正確答案是：'+formatOpt(q.opts[q.ans]);}
  $('q_fb').classList.remove('hidden');
  drawPractice();
}
function nextQ(){

  Q_ANSWERED=false;Q_PICK=-1;

}

  function apply(v){
    v=+v;
    if(rangeId==='v_a'&&Math.abs(v)<0.01)v=v>=0?0.25:-0.25;
    setter(v);r.value=v;n.value=v;if(TAB===2){stopAnim();drawExplore();}
  }
  r.oninput=e=>apply(e.target.value);
  n.onchange=e=>apply(e.target.value);
  n.onkeydown=e=>{if(e.key==='Enter')apply(n.value);};
}
bindSlider('v_a','v_an',v=>{A=rnd(v);});
bindSlider('v_h','v_hn',v=>{HH=rnd(v);});
bindSlider('v_k','v_kn',v=>{KK=rnd(v);});
$('v_axis').onchange=e=>{SHOW_AXIS=e.target.checked;if(TAB===2)drawExplore();};
$('v_vert').onchange=e=>{SHOW_VERT=e.target.checked;if(TAB===2)drawExplore();};
$('v_ext').onchange=e=>{SHOW_EXT=e.target.checked;if(TAB===2)drawExplore();};

// presets
(function(){
  const box=$('v_presets');
  PRESETS.forEach(p=>{
    const b=document.createElement('button');
    b.textContent=p.name;
    b.onclick=()=>{stopAnim();A=p.a;HH=p.h;KK=p.k;syncSliders();
      document.querySelectorAll('#v_presets button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');drawExplore();};
    box.appendChild(b);
  });
})();

document.querySelectorAll('.speedbtn').forEach(b=>{
  b.onclick=()=>{
    SPEED=+b.dataset.spd;
    document.querySelectorAll('.speedbtn').forEach(x=>x.classList.toggle('on',x===b));
  };
});
$('seek').oninput=e=>{
  // manual scrub only pauses and jumps to explore state via proportional lerp of playExplore keyframes — simplified: just pause
  stopAnim();
};

window.addEventListener('resize',()=>{flushLabels();});
renderTex(document);
syncSliders();
draw();
window.vertexFormDemo = {
  switchTab, draw, setStep: n => { STEP=n; draw(); },
  setParams: (a,h,k) => { A=a; HH=h; KK=k; syncSliders(); if(TAB===2)drawExplore(); },
  get: () => ({TAB, STEP, A, HH, KK}),
  answerQ, nextQ, resetQ, playSummary, playExplore, stopAnim
};
})();
</script>
