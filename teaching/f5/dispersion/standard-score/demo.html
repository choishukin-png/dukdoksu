<script>
(function(){
'use strict';

/* ===== tiny offline TeX subset（以 DSE 坐標題 renderer 為底，補希臘字母與 \bar） ===== */
const TEXSYM={
  circ:'°', therefore:'∴', because:'∵', times:'×', cdot:'·',
  perp:'⊥', parallel:'∥', mid:'∣', ne:'≠', neq:'≠', approx:'≈',
  le:'≤', ge:'≥', leq:'≤', geq:'≥', lt:'<', gt:'>',
  angle:'∠', triangle:'△', Gamma:'Γ', ell:'ℓ', pi:'π',
  infty:'∞', pm:'±', mp:'∓', sim:'∼',
  mu:'μ', sigma:'σ', alpha:'α', beta:'β', gamma:'γ', theta:'θ',
  quad:'<span class="sp"></span>'
};
const TEX_MI={mu:'μ',sigma:'σ',alpha:'α',beta:'β',gamma:'γ',theta:'θ',pi:'π',ell:'ℓ'};
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function escAttr(s){return esc(s).replace(/"/g,'&quot;');}
function tex(src){
  src=String(src); let i=0,out='';
  function group(){
    if(i>=src.length) return '';
    if(src[i]==='{'){let depth=1,j=i+1;while(j<src.length&&depth){if(src[j]==='{')depth++;else if(src[j]==='}')depth--;j++;}const g=src.slice(i+1,j-1);i=j;return g;}
    if(src[i]==='\\'){const m=/^\\[a-zA-Z]+/.exec(src.slice(i)); if(m){i+=m[0].length; return m[0];}}
    return src[i++];
  }
  while(i<src.length){
    const ch=src[i];
    if(ch==='\\'){
      const m=/^\\([a-zA-Z]+)/.exec(src.slice(i));
      if(!m){
        if(i+1<src.length){
          const nx=src[i+1]; i+=2;
          if(nx===','||nx===';'||nx===' '||nx===':') out+='<span class="sp"></span>';
          else out+='<span class="mn">'+esc(nx)+'</span>';
        } else i++;
        continue;
      }
      i+=m[0].length;
      const cmd=m[1];
      if(cmd==='text'){out+='<span class="mt">'+esc(group())+'</span>';}
      else if(cmd==='frac'||cmd==='dfrac'||cmd==='tfrac'){
        const a=group(), b=group();
        out+='<span class="frac"><span class="num">'+tex(a)+'</span><span class="den">'+tex(b)+'</span></span>';
      }
      else if(cmd==='sqrt'){
        out+='<span class="sqrt"><span class="rad">√</span><span class="radic">'+tex(group())+'</span></span>';
      }
      else if(cmd==='bar'||cmd==='overline'){
        out+='<span class="bar">'+tex(group())+'</span>';
      }
      else if(TEX_MI[cmd]){out+='<i class="mi">'+TEX_MI[cmd]+'</i>';}
      else if(cmd==='circ'){out+='<span class="mn">°</span>';}
      else if(cmd==='perp'){out+='<span class="mo">⊥</span>';}
      else if(cmd==='angle'){out+='<span class="mn">∠</span>';}
      else if(cmd==='triangle'){out+='<span class="mn">△</span>';}
      else if(cmd==='Gamma'){out+='<i class="mi">Γ</i>';}
      else if(cmd==='left'||cmd==='right'||cmd==='displaystyle'||cmd==='textstyle'||cmd==='bigl'||cmd==='bigr'){
        if(src[i]==='.'){i++;}
        else if(src[i]==='('||src[i]===')'||src[i]==='['||src[i]===']'||src[i]==='|'||src[i]==='{'||src[i]==='}'){out+='<span class="mn">'+esc(src[i])+'</span>';i++;}
      }
      else if(cmd==='therefore'||cmd==='because'){out+='<span class="mn">'+TEXSYM[cmd]+'</span><span class="sp"></span>';}
      else out+='<span class="mn">'+(TEXSYM[cmd]||cmd)+'</span>';
    } else if(ch==='^'){i++;const g=group();out+=(g==='\\circ'||g==='circ')?'<span class="mn">°</span>':'<sup>'+tex(g)+'</sup>';}
    else if(ch==='_'){i++;out+='<sub>'+tex(group())+'</sub>';}
    else if(/[A-Za-z]/.test(ch)){out+='<i class="mi">'+ch+'</i>';i++;}
    else if(/[0-9.]/.test(ch)){let j=i;while(j<src.length&&/[0-9.]/.test(src[j]))j++;out+='<span class="mn">'+src.slice(i,j)+'</span>';i=j;}
    else if('=+-<>'.indexOf(ch)>=0){out+='<span class="mo">'+(ch==='-'?'−':esc(ch))+'</span>';i++;}
    else if(ch===' '){i++;}
    else {out+='<span class="mn">'+esc(ch)+'</span>';i++;}
  }
  return out;
}
function renderTex(root){(root||document).querySelectorAll('[data-tex]').forEach(e=>{e.innerHTML=tex(e.getAttribute('data-tex'));});}
function M(src){return '<span class="m" data-tex="'+escAttr(src)+'"></span>';}

/* ===== SVG helpers ===== */
const svg=document.getElementById('stage');
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,kids){
  const n=document.createElementNS(NS,tag);
  if(attrs) for(const k in attrs){
    if(k==='textContent') n.textContent=attrs[k];
    else if(k==='class'||k==='className') n.setAttribute('class',attrs[k]);
    else if(k==='innerHTML') n.innerHTML=attrs[k];
    else if(attrs[k]!==undefined&&attrs[k]!==null) n.setAttribute(k,attrs[k]);
  }
  if(kids) kids.forEach(c=>n.appendChild(c));
  return n;
}
function clearSvg(){while(svg.firstChild)svg.removeChild(svg.firstChild);}
function svgPoint(evt){
  const pt=svg.createSVGPoint();
  pt.x=evt.clientX; pt.y=evt.clientY;
  const ctm=svg.getScreenCTM();
  if(!ctm) return {x:0,y:0};
  return pt.matrixTransform(ctm.inverse());
}

/* ===== numbers ===== */
function almost(a,b,eps){return Math.abs(a-b)<(eps===undefined?1e-6:eps);}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function zScore(x,mu,sig){return (x-mu)/sig;}
function fromZ(z,mu,sig){return mu+z*sig;}

function fmtNum(x,maxDec){
  if(maxDec===undefined) maxDec=2;
  if(!isFinite(x)) return '—';
  const grid=1e-8;
  if(Math.abs(x)<grid) return '0';
  if(Math.abs(x-Math.round(x))<grid) return String(Math.round(x));
  for(let d=1;d<=maxDec;d++){
    const n=Math.round(x*Math.pow(10,d))/Math.pow(10,d);
    if(Math.abs(x-n)<grid){
      let s=n.toFixed(d);
      if(/^[-]?0\.0+$/.test(s)) return '0';
      return s;
    }
  }
  const n=Math.round(x*Math.pow(10,maxDec))/Math.pow(10,maxDec);
  if(Math.abs(n)<grid) return '0';
  let s=n.toFixed(maxDec);
  s=s.replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1');
  if(s==='-0') s='0';
  return s;
}
function fmtTex(x,maxDec){return fmtNum(x,maxDec);}
function fmtUI(x,maxDec){return fmtNum(x,maxDec).replace(/-/g,'−');}
function isExactDisp(x,maxDec){
  if(!isFinite(x)) return false;
  if(Math.abs(x-Math.round(x))<1e-8) return true;
  const d=maxDec===undefined?2:maxDec;
  const n=Math.round(x*Math.pow(10,d))/Math.pow(10,d);
  return Math.abs(x-n)<1e-8;
}
function snapZ(z){
  for(let k=-8;k<=8;k++){
    const t=k/2;
    if(Math.abs(z-t)<0.04) return t;
  }
  return z;
}
function zColor(z){
  if(almost(z,0,1e-6)) return '#6b7280';
  return z>0?'#1d6fd8':'#e07a1a';
}
function zSignWord(z){
  if(almost(z,0,1e-6)) return '等於平均數';
  const mag=fmtUI(Math.abs(z));
  return (z>0?'高於':'低於')+'平均數 '+mag+' 個標準差';
}

function texZCalc(x,mu,sig){
  const num=x-mu;
  const z=num/sig;
  let s='z=\\dfrac{x-\\mu}{\\sigma}=\\dfrac{'+fmtTex(x)+'-'+fmtTex(mu)+'}{'+fmtTex(sig)+'}';
  s+='=\\dfrac{'+fmtTex(num)+'}{'+fmtTex(sig)+'}';
  if(isExactDisp(z,2)) s+='='+fmtTex(z);
  else s+='\\approx '+fmtTex(z,2);
  return s;
}
function texXCalc(z,mu,sig){
  const x=fromZ(z,mu,sig);
  let s='x=\\mu+z\\sigma='+fmtTex(mu)+(z<0?'':'+')+fmtTex(z)+'\\times '+fmtTex(sig);
  if(isExactDisp(x,2)) s+='='+fmtTex(x);
  else s+='\\approx '+fmtTex(x,2);
  return s;
}

/* ===== demo helper ===== */
function makeDemo(getSteps, hooks){
  const D={i:0, playing:false, token:0};
  D.steps=()=>getSteps();
  D.go=function(n){
    const arr=D.steps();
    D.i=clamp(n,0,arr.length-1);
    if(hooks.onStep) hooks.onStep(D.i, arr[D.i]);
    hooks.redraw();
  };
  D.reset=function(){
    D.token++; D.playing=false; D.i=0;
    if(hooks.onReset) hooks.onReset();
    D.go(0);
  };
  D.play=async function(){
    if(D.playing){D.token++; D.playing=false; hooks.redraw(); return;}
    D.playing=true; const my=++D.token;
    const arr=D.steps();
    if(D.i>=arr.length-1) D.go(0);
    hooks.redraw();
    while(D.i<arr.length-1){
      await new Promise(r=>setTimeout(r, D.i===0?700:1400));
      if(my!==D.token) return;
      D.go(D.i+1);
    }
    D.playing=false; hooks.redraw();
  };
  D.controls=function(){
    return '<button type="button" id="btnPrev">◀ 上一步</button>'
      +'<button type="button" id="btnNext" class="primary">下一步 ▶</button>'
      +'<button type="button" id="btnPlay">'+(D.playing?'❚❚ 暫停':'▶ 播放')+'</button>'
      +'<button type="button" id="btnReset">↺ 重設</button>';
  };
  D.bindControls=function(){
    const n=D.steps().length;
    const prev=document.getElementById('btnPrev');
    const next=document.getElementById('btnNext');
    if(prev){prev.disabled=D.i===0; prev.onclick=()=>D.go(D.i-1);}
    if(next){next.disabled=D.i>=n-1; next.onclick=()=>D.go(D.i+1);}
    const play=document.getElementById('btnPlay'); if(play) play.onclick=()=>D.play();
    const rst=document.getElementById('btnReset'); if(rst) rst.onclick=()=>D.reset();
  };
  return D;
}

/* ===== state ===== */
const DEF={
  meaning:{mu:70,sig:8,x:62},
  compare:{
    m:{name:'數學科',mu:60,sig:4,x:66},   // z=1.5，原始分較低
    e:{name:'英文科',mu:76,sig:16,x:88}   // z=0.75，原始分較高
  },
  typical:{
    m:{name:'數學科',mu:64,sig:4,x:72},   // z=2
    e:{name:'英文科',mu:70,sig:10,x:85}   // z=1.5
  },
  restoreA:{mu:70,sig:8,z:-1},
  restoreB:{x1:57,z1:-2,x2:81,z2:2}
};

const state={
  view:'explore',
  page:'meaning',
  restoreTab:'A',
  mu:DEF.meaning.mu, sig:DEF.meaning.sig, x:DEF.meaning.x,
  m:{mu:DEF.compare.m.mu,sig:DEF.compare.m.sig,x:DEF.compare.m.x},
  e:{mu:DEF.compare.e.mu,sig:DEF.compare.e.sig,x:DEF.compare.e.x},
  a:{mu:DEF.restoreA.mu,sig:DEF.restoreA.sig,z:DEF.restoreA.z},
  b:{x1:DEF.restoreB.x1,z1:DEF.restoreB.z1,x2:DEF.restoreB.x2,z2:DEF.restoreB.z2},
  drag:null,
  chromeKey:''
};

const demo=makeDemo(()=>DEMO_STEPS,{redraw:redraw,onStep:function(){},onReset:function(){}});

const DEMO_STEPS=[
  {flag:'① 為甚麼',kind:'why',
    caption:'為甚麼需要標準分？',
    sub:'只看原始分數，難以比較不同科目的相對表現。',
    m:{mu:64,sig:4,x:72}, e:{mu:70,sig:10,x:85}},
  {flag:'② 定義',kind:'def',
    caption:'標準分的定義與符號意義',
    sub:'把「與平均數的差距」表示成標準差的數目。',
    mu:70,sig:8,x:70},
  {flag:'③ 求 z',kind:'exaZ',
    caption:'例 A：已知得分，求標準分',
    sub:'測驗平均數 72 分，標準差 8 分，志軒得 60 分。',
    mu:72,sig:8,x:60,name:'志軒'},
  {flag:'④ 求 x',kind:'exaX',
    caption:'例 A 續：已知標準分，求得分',
    sub:'同一測驗中，雅婷的標準分為 1.5。',
    mu:72,sig:8,z:1.5,x:84,name:'雅婷',ghost:{x:60,z:-1.5,name:'志軒'}},
  {flag:'⑤ 比較兩科',kind:'cmp',
    caption:'例 B：比較兩科的相對表現',
    sub:'應比較標準分，而不是只看原始分數。',

function makeScale(mu,sig,xList){
  let zAbs=3.4;
  (xList||[]).forEach(function(v){
    if(isFinite(v)) zAbs=Math.max(zAbs, Math.abs((v-mu)/sig)+0.55);
  });
  zAbs=Math.min(zAbs, 6);
  const zmin=-zAbs, zmax=zAbs;
  const x0=90, x1=960;
  function Xz(z){return x0+(z-zmin)/(zmax-zmin)*(x1-x0);}
  function Xs(s){return Xz((s-mu)/sig);}
  function zFrom(px){return zmin+(px-x0)/(x1-x0)*(zmax-zmin);}
  return {mu:mu,sig:sig,zmin:zmin,zmax:zmax,x0:x0,x1:x1,Xz:Xz,Xs:Xs,zFrom:zFrom};
}

function drawBell(sc, yLine, amp){
  const pts=[];
  const n=80;
  for(let i=0;i<=n;i++){
    const z=sc.zmin+(sc.zmax-sc.zmin)*i/n;
    const px=sc.Xz(z);
    const py=yLine-amp*Math.exp(-0.5*z*z);
    pts.push(px+','+py);
  }
  const d='M '+sc.Xz(sc.zmin)+' '+yLine+' L '+pts.join(' ')+' L '+sc.Xz(sc.zmax)+' '+yLine+' Z';
  svg.appendChild(el('path',{d:d,fill:'rgba(29,111,216,0.10)',stroke:'none'}));
}

  }));

function drawTicksRaw(y, sc, opts){
  opts=opts||{};
  const ks=[-3,-2,-1,0,1,2,3];
  ks.forEach(function(k){
    if(k<sc.zmin-1e-9||k>sc.zmax+1e-9) return;
    const px=sc.Xz(k);
    const major=k===0;
    svg.appendChild(el('line',{x1:px,y1:y- (major?12:8),x2:px,y2:y+(major?12:8),stroke:'#334155','stroke-width':major?2.4:1.6}));
    const score=sc.mu+k*sc.sig;
    let sym;
    if(k===0) sym='μ';
    else if(k>0) sym='μ+'+ (k===1?'':'') + (k===1?'σ':(k+'σ'));
    else sym='μ'+ (k===-1?'−σ':('−'+(-k)+'σ'));
    if(k===1) sym='μ+σ';
    if(k===-1) sym='μ−σ';
    if(k===2) sym='μ+2σ';
    if(k===-2) sym='μ−2σ';
    if(k===3) sym='μ+3σ';
    if(k===-3) sym='μ−3σ';
    const hideAt=opts.hideScoreAt;
    const hideArr=hideAt==null?[]:(Array.isArray(hideAt)?hideAt:[hideAt]);
    const skipScore=hideArr.some(function(v){return almost(score,v,1e-6);});
    if(!skipScore){
      svg.appendChild(el('text',{x:px,y:y-16,class:'nlbl',fill:major?'#7a3fa8':'#334155','text-anchor':'middle',textContent:sym}));
      svg.appendChild(el('text',{x:px,y:y+28,class:'nlbl',fill:major?'#7a3fa8':'#4b5563','text-anchor':'middle',textContent:fmtUI(score)}));
    }
  });
}

function drawTicksZ(y, sc, zNow){
  for(let k=-3;k<=3;k++){
    if(k<sc.zmin-1e-9||k>sc.zmax+1e-9) continue;
    const px=sc.Xz(k);
    svg.appendChild(el('line',{x1:px,y1:y-8,x2:px,y2:y+8,stroke:'#334155','stroke-width':k===0?2.4:1.6}));
    const hide=zNow!==undefined && zNow!==null && almost(k,zNow,0.04);
    if(!hide){
      svg.appendChild(el('text',{x:px,y:y+26,class:'nlbl',fill:'#4b5563','text-anchor':'middle',textContent:fmtUI(k)}));
    }
  }
}

  if(k===0) msg='當 '+M('z=0')+' 時，該原始數據等於平均數。';
  else if(k>0) msg='當 '+M('z='+k)+' 時，該原始數據高於平均數 '+k+' 個標準差。';
  else msg='當 '+M('z='+k)+' 時，該原始數據低於平均數 '+(-k)+' 個標準差。';
  return '<div class="ok">'+msg+'</div>';
}

function compareConclusion(z1,z2,rawM,rawE){
  const dz=z1-z2;
  let box, say;
  if(Math.abs(dz)<0.05){
    box='<div class="ok">兩科的相對表現相同。</div>';
    say='兩個標準分相等（或相差不足 0.05），相對表現相同。';
  } else if(dz>=0.05){
    box='<div class="ok">相對於其他考生，數學科的表現較佳，因為其標準分較大。</div>';
    say='∵ '+M('z_{\\text{數}}\\gt z_{\\text{英}}')+'，∴ 數學科的相對表現較佳。'
      +(rawE>rawM?' 注意：英文科的原始分數較高，但不能只比較原始分數。':'');
  } else {
    box='<div class="ok">相對於其他考生，英文科的表現較佳，因為其標準分較大。</div>';
    say='∵ '+M('z_{\\text{英}}\\gt z_{\\text{數}}')+'，∴ 英文科的相對表現較佳。'
      +(rawM>rawE?' 注意：數學科的原始分數較高，但不能只比較原始分數。':'');
  }
  return {box:box,say:say};
}

/* ===== drawing pages ===== */
function drawMeaning(mu,sig,x,opts){
  opts=opts||{};
  const z=zScore(x,mu,sig);
  const col=zColor(z);
  const sc=makeScale(mu,sig,[x]);
  const yRaw=250, yZ=470;
  drawBell(sc,yRaw,110);
  drawGuide(sc.Xs(mu),yRaw,yZ,'#7a3fa8');
  drawGuide(sc.Xs(x),yRaw,yZ,col);
  drawAxis(yRaw,sc,{axisTitle:'原始分數'});
  drawTicksRaw(yRaw,sc,{hideScoreAt: almost(x,mu,1e-6)?null:x});
  drawArrowSpan(sc.Xs(mu),sc.Xs(x), (yRaw+yZ)/2-16, col, 'x − μ = zσ');
  const nearTick=almost(z,Math.round(z),0.08) || Math.abs(sc.Xs(x)-sc.Xs(mu))<46;
  const xLabelY = nearTick ? yRaw-44 : yRaw-36;
  if(almost(x,mu,1e-6)){
    drawHandle(sc.Xs(x), yRaw, col, 'hX', 'x = μ = '+fmtUI(x), yRaw-44);
  } else {
    const lab=(opts.name?opts.name+'  ':'')+'x = '+fmtUI(x);
    drawHandle(sc.Xs(x), yRaw, col, 'hX', lab, xLabelY);
  }

  drawAxis(yZ,sc,{axisTitle:'z 軸',color:'#1f2937'});
  drawTicksZ(yZ,sc,z);
  drawHandle(sc.Xz(z), yZ, col, 'hZ', 'z = '+fmtUI(z), yZ-28);

  if(opts.live!==false){
    updateSliderVal('slMu',mu); updateSliderVal('slSig',sig); updateSliderVal('slX',x);
    const note=isExactDisp(z,2)?'':'<span class="note">（準確至兩位小數）</span>';
    const read=
      '<span>'+M('x')+'（得分）</span><span class="v">'+fmtUI(x)+'</span>'
      +'<span>'+M('\\mu')+'（平均數）</span><span class="v">'+fmtUI(mu)+'</span>'
      +'<span>'+M('\\sigma')+'（標準差）</span><span class="v">'+fmtUI(sig)+'</span>'
      +'<span>'+M('z')+'（標準分）</span><span class="v" style="color:'+col+'">'+fmtUI(z)+'</span>';
    const eq=M(texZCalc(x,mu,sig))+' '+note;
    const say='口語解釋：這項得分<strong>'+zSignWord(z)+'</strong>。標準分沒有單位。';
    setLive(read, eq, say, integerZBox(z));
  }
  return {sc:sc,z:z,col:col,yRaw:yRaw,yZ:yZ};
}

function drawTwoSubjects(m,e,opts){
  opts=opts||{};
  const z1=zScore(m.x,m.mu,m.sig), z2=zScore(e.x,e.mu,e.sig);
  const c1='#1d6fd8', c2='#7a3fa8';
  // shared z scale must cover both z values
  const zAbs=Math.max(3.4, Math.abs(z1)+0.55, Math.abs(z2)+0.55, 3.4);
  const dummy={mu:0,sig:1};
  const sc=makeScale(0,1,[-zAbs,zAbs]); // Xz works; Xs(s)=Xz(s)
  const yM=150, yE=310, yZ=500;
  // For subject scales aligned to the shared z axis: position = Xz( (x-mu)/sig )
  function scSub(sub){ return {Xz:sc.Xz, Xs:function(s){return sc.Xz((s-sub.mu)/sub.sig);}, mu:sub.mu,sig:sub.sig,zmin:sc.zmin,zmax:sc.zmax,x0:sc.x0,x1:sc.x1}; }

  const scM=scSub(m), scE=scSub(e);
  drawBell(scM,yM,80);
  drawBell(scE,yE,80);
  drawGuide(scM.Xs(m.mu),yM,yZ,'#7a3fa8');
  drawGuide(scM.Xs(m.x),yM,yZ,c1);
  drawGuide(scE.Xs(e.x),yE,yZ,c2);

  drawAxis(yM,scM,{axisTitle:'數學科',color:'#1d6fd8'});
  drawTicksRaw(yM,scM,{hideScoreAt:m.x});
  const mLabY=Math.abs(scM.Xs(m.x)-scM.Xs(m.mu))<46?yM-50:yM-28;
  drawHandle(scM.Xs(m.x),yM,c1,'hMx','x = '+fmtUI(m.x),mLabY);

  drawAxis(yE,scE,{axisTitle:'英文科',color:'#7a3fa8'});
  drawTicksRaw(yE,scE,{hideScoreAt:e.x});
  const eLabY=Math.abs(scE.Xs(e.x)-scE.Xs(e.mu))<46?yE-50:yE-28;
  drawHandle(scE.Xs(e.x),yE,c2,'hEx','x = '+fmtUI(e.x),eLabY);

  drawAxis(yZ,sc,{axisTitle:'共用 z 軸'});
  drawTicksZ(yZ,sc, undefined);
  // two z markers; stagger labels if close
  let z1y=yZ-34, z2y=yZ-34;
  if(Math.abs(sc.Xz(z1)-sc.Xz(z2))<90){ z1y=yZ-58; z2y=yZ-30; }
  drawHandle(sc.Xz(z1),yZ,c1,'hMz','z數 = '+fmtUI(z1),z1y);
  drawHandle(sc.Xz(z2),yZ,c2,'hEz','z英 = '+fmtUI(z2),z2y);

  if(opts.live!==false){
    updateSliderVal('slMmu',m.mu); updateSliderVal('slMsig',m.sig); updateSliderVal('slMx',m.x);
    updateSliderVal('slEmu',e.mu); updateSliderVal('slEsig',e.sig); updateSliderVal('slEx',e.x);
    const n1=isExactDisp(z1,2)?'':'（準確至兩位小數）';
    const n2=isExactDisp(z2,2)?'':'（準確至兩位小數）';
    const read=
      '<span>數學科 '+M('x,\\mu,\\sigma')+'</span><span class="v">'+fmtUI(m.x)+'，'+fmtUI(m.mu)+'，'+fmtUI(m.sig)+'</span>'
      +'<span>數學科 '+M('z_{\\text{數}}')+'</span><span class="v" style="color:'+c1+'">'+fmtUI(z1)+(n1?'*':'')+'</span>'
      +'<span>英文科 '+M('x,\\mu,\\sigma')+'</span><span class="v">'+fmtUI(e.x)+'，'+fmtUI(e.mu)+'，'+fmtUI(e.sig)+'</span>'
      +'<span>英文科 '+M('z_{\\text{英}}')+'</span><span class="v" style="color:'+c2+'">'+fmtUI(z2)+(n2?'*':'')+'</span>';
    const eq='<div>數學科　'+M(texZCalc(m.x,m.mu,m.sig))+'</div>'
            +'<div>英文科　'+M(texZCalc(e.x,e.mu,e.sig))+'</div>';
    const cc=compareConclusion(z1,z2,m.x,e.x);
    setLive(read, eq, cc.say, cc.box);
  }
  return {sc:sc,scM:scM,scE:scE,z1:z1,z2:z2,yM:yM,yE:yE,yZ:yZ};
}

function drawRestoreA(a,opts){

function solveMuSig(b){
  if(almost(b.z1,b.z2,1e-9)) return {ok:false};
  const sig=(b.x2-b.x1)/(b.z2-b.z1);
  if(!(sig>0) || !isFinite(sig)) return {ok:false, sig:sig};
  const mu=b.x1-b.z1*sig;
  return {ok:true, mu:mu, sig:sig};
}

function drawRestoreB(b,opts){
  const sol=solveMuSig(b);
  const yRaw=250, yZ=470;
  if(!sol.ok){
    // still show two scores on a generic 0-100 ish line
    const xmin=Math.min(b.x1,b.x2,0)-5, xmax=Math.max(b.x1,b.x2,100)+5;
    const x0=90,x1=960;
    const Xs=function(s){return x0+(s-xmin)/(xmax-xmin)*(x1-x0);};
    const sc={x0:x0,x1:x1,Xz:function(z){return x0+(z+3)/6*(x1-x0);},Xs:Xs,zmin:-3,zmax:3,mu:0,sig:1};
    drawAxis(yRaw,sc,{axisTitle:'原始分數'});
    drawHandle(Xs(b.x1),yRaw,'#1d6fd8','hX1','甲  x = '+fmtUI(b.x1),yRaw-28);
    drawHandle(Xs(b.x2),yRaw,'#7a3fa8','hX2','乙  x = '+fmtUI(b.x2),yRaw-28);
    if(!(opts&&opts.live===false)){
      updateSliderVal('slBx1',b.x1); updateSliderVal('slBz1',b.z1);
      updateSliderVal('slBx2',b.x2); updateSliderVal('slBz2',b.z2);
      setLive('', '', '',
        almost(b.z1,b.z2,1e-9)
          ? '<div class="warn">兩個標準分相等，無法唯一決定平均數和標準差。（需要 '+M('z_1\\neq z_2')+'）</div>'
          : '<div class="warn">計算所得的標準差不是正數，請檢查數據。</div>'
      );
    }
    return;
  }
  const sc=makeScale(sol.mu,sol.sig,[b.x1,b.x2]);
  const c1=zColor(b.z1), c2=zColor(b.z2);
  drawBell(sc,yRaw,110);
  drawGuide(sc.Xs(sol.mu),yRaw,yZ,'#7a3fa8');
  drawGuide(sc.Xs(b.x1),yRaw,yZ,c1);
  drawGuide(sc.Xs(b.x2),yRaw,yZ,c2);
  drawAxis(yRaw,sc,{axisTitle:'原始分數'});
  drawTicksRaw(yRaw,sc,{hideScoreAt:[b.x1,b.x2]});
  let y1=yRaw-28, y2=yRaw-28;
  if(Math.abs(sc.Xs(b.x1)-sc.Xs(b.x2))<80){ y1=yRaw-70; y2=yRaw-28; }
  drawHandle(sc.Xs(b.x1),yRaw,c1,'hX1','甲  x = '+fmtUI(b.x1),y1);
  drawHandle(sc.Xs(b.x2),yRaw,c2,'hX2','乙  x = '+fmtUI(b.x2),y2);
  drawAxis(yZ,sc,{axisTitle:'z 軸'});
  drawTicksZ(yZ,sc, undefined);
  let z1y=yZ-52, z2y=yZ-28;
  drawHandle(sc.Xz(b.z1),yZ,c1,'hZ1','z甲 = '+fmtUI(b.z1),z1y);
  drawHandle(sc.Xz(b.z2),yZ,c2,'hZ2','z乙 = '+fmtUI(b.z2),z2y);

  if(!(opts&&opts.live===false)){
    updateSliderVal('slBx1',b.x1); updateSliderVal('slBz1',b.z1);
    updateSliderVal('slBx2',b.x2); updateSliderVal('slBz2',b.z2);
    const noteS=isExactDisp(sol.sig,2)?'':'（準確至兩位小數）';
    const noteM=isExactDisp(sol.mu,2)?'':'（準確至兩位小數）';
    const read=
      '<span>甲 '+M('(x_1,z_1)')+'</span><span class="v">'+fmtUI(b.x1)+'，'+fmtUI(b.z1)+'</span>'
      +'<span>乙 '+M('(x_2,z_2)')+'</span><span class="v">'+fmtUI(b.x2)+'，'+fmtUI(b.z2)+'</span>'
      +'<span>'+M('\\sigma')+'</span><span class="v">'+fmtUI(sol.sig)+'</span>'
      +'<span>'+M('\\mu')+'</span><span class="v">'+fmtUI(sol.mu)+'</span>';
    const eq='<div>'+M('\\sigma=\\dfrac{x_2-x_1}{z_2-z_1}=\\dfrac{'+fmtTex(b.x2)+'-'+fmtTex(b.x1)+'}{'+fmtTex(b.z2)+'-('+fmtTex(b.z1)+')}='+fmtTex(sol.sig))+ (noteS?' <span class="note">'+noteS+'</span>':'')+'</div>'
            +'<div>'+M('\\mu=x_1-z_1\\sigma='+fmtTex(b.x1)+'-('+fmtTex(b.z1)+')\\times '+fmtTex(sol.sig)+'='+fmtTex(sol.mu))+ (noteM?' <span class="note">'+noteM+'</span>':'')+'</div>';
    const say='聯立 '+M('x_1=\\mu+z_1\\sigma')+' 與 '+M('x_2=\\mu+z_2\\sigma')+'，求得平均數為 '+fmtUI(sol.mu)+'，標準差為 '+fmtUI(sol.sig)+'。';
    const box='<div class="ok">'+M('\\mu='+fmtTex(sol.mu))+'，'+M('\\sigma='+fmtTex(sol.sig))+'</div>';
    setLive(read, eq, say, box);
  }
}

      +'<p>例如：數學科得 72 分，英文科得 85 分。英文科的原始分數較高，是否代表英文科的相對表現較佳？</p>'
      +'<div class="info">因此我們需要一個沒有單位、可作比較的量——<strong>標準分</strong>。</div>';

      +'<div class="ok">'+M('\\therefore')+' 雅婷的得分為 84 分，高於平均數 1.5 個標準差。</div>';
  } else if(k==='cmp'){
    html+='<p>同一學生：數學科得分 72（平均數 64，標準差 4）；英文科得分 85（平均數 70，標準差 10）。哪一科的相對表現較佳？</p>'
      +'<p>數學科：'+M('z_{\\text{數}}=\\dfrac{72-64}{4}=\\dfrac{8}{4}=2')+'</p>'
      +'<p>英文科：'+M('z_{\\text{英}}=\\dfrac{85-70}{10}=\\dfrac{15}{10}=1.5')+'</p>'

  const step=DEMO_STEPS[demo.i];

  demoPanel(step);
  const k=step.kind;
  if(k==='why'){
    // show two raw lines, but hide the shared-z conclusion emphasis? still show z axis with question
    drawTwoSubjects(step.m,step.e,{live:false});
    // overlay question marks? the live panel already poses the question. Fine.
  } else if(k==='def'){
    drawMeaning(step.mu,step.sig,step.x,{live:false,alwaysHandle:true});
  } else if(k==='exaZ'){
    drawMeaning(step.mu,step.sig,step.x,{live:false,name:step.name});
  } else if(k==='exaX'){
    drawMeaning(step.mu,step.sig,step.x,{live:false,name:step.name});
    if(step.ghost){
      const sc=makeScale(step.mu,step.sig,[step.x,step.ghost.x]);
      const yRaw=250, col=zColor(step.ghost.z);
      svg.appendChild(el('circle',{cx:sc.Xs(step.ghost.x),cy:yRaw,r:9,fill:col,stroke:'#fff','stroke-width':2,opacity:'0.7'}));
      svg.appendChild(el('text',{x:sc.Xs(step.ghost.x),y:yRaw+50,class:'lbl-cjk',fill:col,'text-anchor':'middle',opacity:'0.85',textContent:step.ghost.name+'  x = '+fmtUI(step.ghost.x)}));
    }
  } else if(k==='cmp'||k==='sum'){
    drawTwoSubjects(step.m,step.e,{live:false});
  } else if(k==='sys'){
    drawRestoreB(step.b,{live:false});
  }
}

}

function redraw(opt){
  const keep=opt&&opt.keepChrome;
  clearSvg();
  addDefs();
  if(state.view==='demo'){
    if(!keep || state.chromeKey!==chromeKey()){
      setViewChrome();
      state.chromeKey=chromeKey();
    } else {
      // still need to refresh demo controls play label and flags
      setViewChrome();
      state.chromeKey=chromeKey();
    }
    drawDemo();
    return;
  }
  if(!keep || state.chromeKey!==chromeKey()){
    setViewChrome();
    buildExploreChrome();
    state.chromeKey=chromeKey();
  }
  if(state.page==='meaning') drawMeaning(state.mu,state.sig,state.x);
  else if(state.page==='compare') drawTwoSubjects(state.m,state.e);
  else if(state.restoreTab==='A') drawRestoreA(state.a);
  else drawRestoreB(state.b);
}

/* ===== flags / modes ===== */
document.getElementById('flags').addEventListener('click',function(e){
  const f=e.target.closest('.flag'); if(!f) return;
  if(state.view==='explore'){
    const p=f.dataset.page; if(!p) return;
    state.page=p;
    redraw();
  } else {
    const i=parseInt(f.dataset.step,10);
    if(!isNaN(i)) demo.go(i);
  }
});

document.getElementById('btnModeExplore').onclick=function(){
  state.view='explore';
  demo.token++; demo.playing=false;
  redraw();
};
document.getElementById('btnModeDemo').onclick=function(){
  state.view='demo';
  demo.go(demo.i||0);
};

document.addEventListener('keydown',function(e){
  if(state.view!=='demo') return;
  const tag=(e.target&&e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea') return;
  if(e.key==='ArrowLeft'){e.preventDefault(); demo.go(demo.i-1);}
  else if(e.key==='ArrowRight'){e.preventDefault(); demo.go(demo.i+1);}
  else if(e.key===' '||e.key==='Spacebar'){e.preventDefault(); demo.play();}
});

/* ===== drag ===== */
function handleKindFromTarget(t){
  if(!t || t===svg) return null;
  const id=t.id||'';
  // only .handle elements
  if(!(t.classList&&t.classList.contains('handle'))){
    const h=t.closest && t.closest('.handle');
    if(!h) return null;
  }
  if(id==='hX'||id==='hXHit'||id==='hXStem'||id==='hZ'||id==='hZHit'||id==='hZStem'){
    if(state.view==='explore' && (state.page==='meaning' || (state.page==='restore'&&state.restoreTab==='A'))) return 'xOrZ';
  }
  if(id==='hMx'||id==='hMxHit'||id==='hMxStem') return 'mx';
  if(id==='hEx'||id==='hExHit'||id==='hExStem') return 'ex';
  if(id==='hMz'||id==='hMzHit'||id==='hMzStem') return 'mz';
  if(id==='hEz'||id==='hEzHit'||id==='hEzStem') return 'ez';
  if(id==='hX1'||id==='hX1Hit'||id==='hX1Stem') return 'x1';
  if(id==='hX2'||id==='hX2Hit'||id==='hX2Stem') return 'x2';
  if(id==='hZ1'||id==='hZ1Hit'||id==='hZ1Stem') return 'z1';
  if(id==='hZ2'||id==='hZ2Hit'||id==='hZ2Stem') return 'z2';
  return null;
}

function currentScaleFor(kind){
  if(kind==='xOrZ'){
    if(state.page==='restore'&&state.restoreTab==='A'){
      const x=fromZ(state.a.z,state.a.mu,state.a.sig);
      return makeScale(state.a.mu,state.a.sig,[x]);
    }
    return makeScale(state.mu,state.sig,[state.x]);
  }
  if(kind==='mx'||kind==='mz'||kind==='ex'||kind==='ez'){
    const z1=zScore(state.m.x,state.m.mu,state.m.sig), z2=zScore(state.e.x,state.e.mu,state.e.sig);
    const zAbs=Math.max(3.4, Math.abs(z1)+0.55, Math.abs(z2)+0.55);
    return makeScale(0,1,[-zAbs,zAbs]);
  }
  if(kind==='x1'||kind==='x2'||kind==='z1'||kind==='z2'){
    const sol=solveMuSig(state.b);
    if(sol.ok) return makeScale(sol.mu,sol.sig,[state.b.x1,state.b.x2]);
    return null;
  }
  return null;
}

function endDrag(e){
  if(state.drag && e && typeof e.pointerId==='number'){
    try{ if(svg.hasPointerCapture && svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId); }catch(_){}
  }
  state.drag=null;
}

svg.addEventListener('pointerdown',function(e){
  if(state.view==='demo') return; // lock figure in demo
  const kind=handleKindFromTarget(e.target);
  if(!kind) return;
  state.drag={kind:kind, pointerId:e.pointerId};
  try{ svg.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault();
});

svg.addEventListener('pointermove',function(e){
  if(!state.drag) return;
  e.preventDefault();
  const p=svgPoint(e);
  const kind=state.drag.kind;
  const sc=currentScaleFor(kind);
  if(!sc) return;
  let z=sc.zFrom(p.x);
  z=clamp(z, sc.zmin, sc.zmax);
  z=snapZ(z);
  if(kind==='xOrZ'){
    if(state.page==='restore'&&state.restoreTab==='A'){
      state.a.z=clamp(z,-3.5,3.5);
    } else {
      state.x=fromZ(z,state.mu,state.sig);
    }
  } else if(kind==='mx'||kind==='mz'){
    state.m.x=fromZ(z,state.m.mu,state.m.sig);
  } else if(kind==='ex'||kind==='ez'){
    state.e.x=fromZ(z,state.e.mu,state.e.sig);
  } else if(kind==='x1'||kind==='z1'){
    // dragging on computed scale: changing x1 keeps z1, would change mu/sig; better change x and keep z
    if(kind==='x1'){ state.b.x1=fromZ(z, sc.mu, sc.sig); }
    else { state.b.z1=snapZ(clamp(z,-3,3)); }
  } else if(kind==='x2'||kind==='z2'){
    if(kind==='x2'){ state.b.x2=fromZ(z, sc.mu, sc.sig); }
    else { state.b.z2=snapZ(clamp(z,-3,3)); }
  }
  redraw({keepChrome:true});
},{passive:false});

svg.addEventListener('pointerup',endDrag);
svg.addEventListener('pointercancel',endDrag);
svg.addEventListener('lostpointercapture',function(){state.drag=null;});

/* ===== query params ===== */
function applySnap(id){
  if(!id) return;
  if(id==='btnCompare'||id==='btnCompareP'){ applyTypicalCompare(); return; }
  if(id==='btnZ0'||id==='btnZ0p'){ jumpZ(0); return; }
  if(id==='btnZ1'||id==='btnZ1p'){ jumpZ(1); return; }
  if(id==='btnZ2'||id==='btnZ2p'){ jumpZ(2); return; }
  if(id==='btnZm15'||id==='btnZm15p'){ jumpZ(-1.5); return; }
  if(id==='btnRestoreEx'){
    state.view='explore'; state.page='restore'; state.restoreTab='B';
    state.b={x1:DEF.restoreB.x1,z1:DEF.restoreB.z1,x2:DEF.restoreB.x2,z2:DEF.restoreB.z2};
    redraw(); return;
  }
  const b=document.getElementById(id);
  if(b) b.click();
}

(function init(){
  const q=new URLSearchParams(location.search);
  const mode=q.get('mode');
  if(mode==='demo'){
    state.view='demo';
    const st=parseInt(q.get('step'),10);
    const idx=(!isNaN(st) && st>=1 && st<=DEMO_STEPS.length)? st-1 : 0;
    demo.i=idx;
    redraw();
  } else {
    state.view='explore';
    const page=q.get('page');
    if(page==='compare'||page==='meaning'||page==='restore') state.page=page;
    if(q.get('tab')==='B') state.restoreTab='B';
    redraw();
    const snap=q.get('snap');
    if(snap) applySnap(snap);
  }
  // if mode=explore with snap, already drawn
  if(mode==='demo'){ /* done */ }
})();

})();
</script>
